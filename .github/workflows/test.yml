name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@b40c5ff9d096be46c9e573382e93149256a33a9a

  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            qt_host: mac
            qt_arch: ''
            qt_dir: macos
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_dir: msvc2022_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Qt
        if: matrix.qt_arch != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}
      - name: Install Qt (default architecture)
        if: matrix.qt_arch == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - name: Install Modules
        run: npm ci --ignore-scripts
      - name: Locate Temporary Directory
        run: |
          QT_TMP0='${{ github.workspace }}'
          QT_TMP1="${QT_TMP0//'\'/"/"}"
          echo "QT_TMP=$QT_TMP1/../__tmp" >> "$GITHUB_ENV"
      - name: Create Qt Subdirectories
        run: chmod +x src/qt-mkdir.sh && src/qt-mkdir.sh "${{ env.QT_TMP }}"
      - name: Copy Qt Directory - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          chmod +x src/qt-copy-linux.sh
          src/qt-copy-linux.sh "${{ env.QT_TMP }}" "${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}"
      - name: Copy Qt Directory - macOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          chmod +x src/qt-copy-macos.sh
          src/qt-copy-macos.sh "${{ env.QT_TMP }}" "${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}"
      - name: Copy Qt Directory - Windows
        if: startsWith(matrix.target, 'windows-')
        run: src/qt-copy-windows.sh '${{ env.QT_TMP }}' '${{ github.workspace }}\..\Qt\6.8.0\${{ matrix.qt_dir }}'
      - name: Stage Built Binaries
        run: |
          node -e "import('@node-3d/addon-tools').then(async (m) => { const fs = await import('node:fs/promises'); await fs.cp(process.env.QT_TMP, m.getBin(), { recursive: true }); })"
      - name: Run Unit Tests
        run: npm run test:ci
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@b40c5ff9d096be46c9e573382e93149256a33a9a
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, unit-tests]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@b40c5ff9d096be46c9e573382e93149256a33a9a
        with:
          package-name: '@node-3d/deps-qt-core'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Build Packed Consumer Addon
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm run build
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test
